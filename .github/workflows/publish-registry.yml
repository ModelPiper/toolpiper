# Republish server.json to the Official MCP Registry whenever it changes.
#
# WHY THIS EXISTS: the registry entry sat at 0.0.6-beta with "300+" tools and a
# stdio transport from 2026-06-11 to 2026-09-05, three releases behind the
# product, because publishing was a manual step nobody re-ran. This makes it a
# consequence of the push instead of a thing to remember.
#
# WHY OIDC: the `io.github.ModelPiper/*` namespace is authenticated either by an
# interactive GitHub login or by a GitHub Action running on a ModelPiper repo.
# This is the second, so publishing needs no personal OAuth grant and stores no
# credential; the job authenticates as this repository.
name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for `mcp-publisher login github-oidc`. Nothing else is needed:
      # the job reads server.json and writes only to the registry.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
        env:
          # Pinned rather than latest: an unattended publish should not change
          # behaviour because upstream cut a release.
          MCP_PUBLISHER_VERSION: v1.8.1

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
